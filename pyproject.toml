[project]
name = "caprine-clinic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "James Hodgkinson", email = "james@terminaloutcomes.com" }]
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scripts"
module-root = "./"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.10", "ty>=0.0.85"]


[tool.ty.environment]
extra-paths = ["scripts"]
