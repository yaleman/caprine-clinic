name: Package Splunk app

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      archive: ${{ steps.package.outputs.archive }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TSX_DISABLE_CACHE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, as reference
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test, typecheck and package
        run: npm run check
      - name: Verify reproducible package
        run: |
          cp dist/*.tar.gz /tmp/clinic-first.tar.gz
          npm run build
          cmp /tmp/clinic-first.tar.gz dist/*.tar.gz
          (cd dist && sha256sum --check *.sha256)
      - name: Read package identity
        id: package
        run: npm run package:metadata
      - name: Upload versioned package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: caprine_clinic-${{ steps.package.outputs.tag }}-${{ github.sha }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  publish:
    needs: package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: caprine_clinic-${{ needs.package.outputs.tag }}-${{ github.sha }}
          path: dist
      - name: Verify downloaded package checksum
        run: (cd dist && sha256sum --check *.sha256)
      - name: Create or update versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          RELEASE_ARCHIVE: ${{ needs.package.outputs.archive }}
        run: bash scripts/publish_release.sh
